# The desktop build on arm64 Linux (ARCH=arm64 tools/docker/desktop.sh, native on Apple Silicon). Not really a cross
# build: the compilers are the container's own gcc. The project and libntr declare NASM, which only the DS build uses,
# and meson refuses NASM on a non-x86 host, so the host is named x86-64 here, as tools/android/build_apk.sh does for
# the APK; nothing in the build takes its flags from it.
[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
nasm = 'nasm'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
